name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test parser
        run: python -m pytest
      - name: Package
        run: pyinstaller --noconfirm --windowed --name RAW-Case-Viewer run_case_viewer.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw-case-viewer-${{ matrix.os }}
          path: dist/RAW-Case-Viewer*
