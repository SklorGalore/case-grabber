[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "case-viewer"
version = "0.1.0"
description = "Read-only PSS/E revision 35 RAW case inspector"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PyInstaller>=6"]

[project.scripts]
case-viewer = "case_viewer.app:main"

[tool.setuptools.packages.find]
include = ["case_viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
